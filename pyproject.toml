[project]
name = "naanayam"
version = "0.1.0"
description = "Naanayam: from payment collections to financial proof (Paytm Build for India AI Hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    # the live classifier
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2",
    "pyarrow>=15",
]
dev = ["pytest>=8"]

# Dependencies only: install with `pip install -e ".[dev,ml]"`. The code is run from the repo
# (uvicorn from backend/, scripts with `python -m` from the root), not installed as a package.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
